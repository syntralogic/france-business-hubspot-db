# PostgreSQL + the pipeline image. Secrets come from .env (never committed, chmod 600).
# First time:  docker compose up -d db && docker compose --profile jobs run --rm app bash scripts/init_db.sh
# Weekly run:  docker compose --profile jobs run --rm -T app bash scripts/run_weekly.sh   (scheduled by host cron, see deploy/crontab.example)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: fbdb
      POSTGRES_USER: fbdb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Defaults fit a small 2 vCPU / 4 GB pilot server. For the full load on 8 vCPU / 32 GB set in .env:
    #   PG_SHARED_BUFFERS=4GB PG_EFFECTIVE_CACHE_SIZE=16GB PG_MAINTENANCE_WORK_MEM=1GB PG_WORK_MEM=64MB PG_MAX_WAL_SIZE=8GB
    command: ["postgres",
              "-c", "shared_buffers=${PG_SHARED_BUFFERS:-1GB}",
              "-c", "effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-2GB}",
              "-c", "maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}",
              "-c", "work_mem=${PG_WORK_MEM:-16MB}",
              "-c", "max_wal_size=${PG_MAX_WAL_SIZE:-2GB}"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups          # pg_dump output (scripts/backup.sh) and restore input
    ports:
      - "127.0.0.1:5432:5432"      # local only: never expose the database to the internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbdb -d fbdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fbdb:${POSTGRES_PASSWORD}@db:5432/fbdb
    volumes:
      - ./reports:/app/reports
      - ./data:/app/data
      - ./backups:/app/backups
    profiles: ["jobs"]            # only started by `docker compose run`, never by `up`
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "5"}

volumes:
  pgdata:
