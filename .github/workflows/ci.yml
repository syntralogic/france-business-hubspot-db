name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: fbdb, POSTGRES_PASSWORD: fbdb, POSTGRES_DB: fbdb_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fbdb" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://fbdb:fbdb@localhost:5432/fbdb_test
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: Docker image builds
        run: docker build -t fbdb:ci . && docker build -f Dockerfile.render -t fbdb-render:ci .
