name: Diagnose stats
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python scripts/diag_stats.py /tmp/stats_report.txt
      - name: Publish report
        if: always()
        run: |
          git config user.email "ci@example.com"; git config user.name "ci"
          git fetch -q origin diag; git checkout -q -B diag origin/diag
          cp /tmp/stats_report.txt stats_report.txt; git add stats_report.txt; git commit -qm "stats report"; git push -q origin diag
