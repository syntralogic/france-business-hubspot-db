name: Diagnose RGE
on:
  workflow_dispatch:
    inputs:
      rge_csv_url:
        default: "https://www.data.gouv.fr/api/1/datasets/r/651ee65a-72b5-48a7-9759-6adabe7b3404"
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RGE_URL: ${{ inputs.rge_csv_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt
      - run: python scripts/diag_rge.py /tmp/rge_report.txt
      - name: Publish report to branch diag
        if: always()
        run: |
          git config user.email "ci@example.com"; git config user.name "ci"
          git checkout --orphan diag; git rm -rf . -q
          cp /tmp/rge_report.txt rge_report.txt
          git add rge_report.txt; git commit -qm "rge report"; git push -f origin diag
