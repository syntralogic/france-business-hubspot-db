name: Load full RGE (ADEME)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rge:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt && pip install -e . 2>/dev/null || true
      - name: Download full RGE list
        run: mkdir -p data/raw && python scripts/fetch_rge.py data/raw/rge_full.csv 2>&1 | tee /tmp/rge_run.txt
      - name: Load RGE
        run: python -m fbdb.enrich.ademe_rge data/raw/rge_full.csv --rejects /tmp/rge_rejects.csv 2>&1 | tee -a /tmp/rge_run.txt
      - name: Publish summary to branch diag
        if: always()
        run: |
          tail -n 25 /tmp/rge_run.txt > /tmp/rge_summary.txt; wc -l data/raw/rge_full.csv >> /tmp/rge_summary.txt
          git config user.email "ci@example.com"; git config user.name "ci"
          git fetch -q origin diag; git checkout -q -B diag origin/diag
          cp /tmp/rge_summary.txt rge_summary.txt; git add rge_summary.txt; git commit -qm "rge summary"; git push -q origin diag
