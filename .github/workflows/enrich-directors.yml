name: Enrich directors (4 parallel workers)
# Free source (Annuaire des entreprises). Resumable: companies already checked are skipped. Re-run to continue.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Companies per worker this run (~1 company/s per worker)"
        default: "15000"
jobs:
  directors:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt && pip install -e . 2>/dev/null || true
      - run: python -m fbdb.enrich.directors --limit ${{ inputs.limit }} --shard ${{ matrix.shard }}/4
