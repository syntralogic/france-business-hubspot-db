name: Enrich legal events (BODACC)
# Free source. France-wide feed, matched on our SIRENs. 30 days takes about an hour; more days = many hours.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many past days to read"
        default: "30"
concurrency:
  group: db-writes
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -c constraints.txt && pip install -e . 2>/dev/null || true
      - run: python -m fbdb.enrich.bodacc --days ${{ inputs.days }}
      - run: python -m fbdb.enrich.register_events --days ${{ inputs.days }}
