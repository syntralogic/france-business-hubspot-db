name: Pappers response sample
on:
  workflow_dispatch:
    inputs:
      siren:
        default: "492892195"
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    env:
      PAPPERS_API_KEY: ${{ secrets.PAPPERS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/pappers_sample.py /tmp/pappers_sample.txt ${{ inputs.siren }}
      - name: Publish structure to branch diag
        if: always()
        run: |
          git config user.email "ci@example.com"; git config user.name "ci"
          git fetch -q origin diag; git checkout -q -B diag origin/diag
          cp /tmp/pappers_sample.txt pappers_sample.txt; git add pappers_sample.txt; git commit -qm "pappers sample"; git push -q origin diag
