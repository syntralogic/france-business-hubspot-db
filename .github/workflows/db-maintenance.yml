name: Database maintenance
# Frees the load staging tables (temporary copies of the SIRENE rows, rebuilt at every load) and refreshes statistics.
on:
  workflow_dispatch:
concurrency:
  group: db-writes
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Free staging tables and refresh statistics
        run: psql "$DATABASE_URL" -c "SET statement_timeout=0" -c "TRUNCATE stg_sirene_ul, stg_sirene_etab" -c "ANALYZE"
      - name: Show database size
        run: |
          psql "$DATABASE_URL" -Atc "select pg_size_pretty(pg_database_size(current_database()))"
